[project]
name = "synthdata"
version = "0.1.0"
description = "Synthetic dental data generator for Northgate Dental. Every record is synthetic."
requires-python = ">=3.12"
dependencies = ["faker>=30", "pydantic>=2.9", "pyyaml>=6"]

[project.scripts]
synthdata = "synthdata.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

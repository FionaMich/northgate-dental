[project]
name = "worker"
version = "0.1.0"
description = "Northgate Dental notification worker: reads Supabase Queues and sends confirmations and reminders."
requires-python = ">=3.12"
dependencies = ["psycopg[binary]>=3.2", "httpx>=0.27"]

[project.scripts]
worker = "worker.main:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

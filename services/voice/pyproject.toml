[project]
name = "voice"
version = "0.1.0"
description = "Nora on a voice call: Stream audio, local speech recognition, ElevenLabs voice, the assistant API as the brain"
readme = "README.md"
authors = [
    { name = "Michelle Fiona Opiyo", email = "michelle.fiona.opiyo.ke@gmail.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx>=0.28",
    "vision-agents[elevenlabs,fast-whisper,getstream]>=0.6.9,<0.7",
]

[project.scripts]
voice = "voice:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9",
]

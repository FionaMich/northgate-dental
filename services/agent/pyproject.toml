[project]
name = "agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Michelle Fiona Opiyo", email = "michelle.fiona.opiyo.ke@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "langchain-core>=1.8.4",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.24",
    "langsmith>=0.16.0",
    "prometheus-client>=0.21",
    "pydantic>=2.14.4",
    "pyyaml>=6.0.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
agent = "agent:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

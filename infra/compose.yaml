# Northgate's server stack on the Oracle VM (blueprint sections 52, 53 and 55; Addendum C4: no Redis, Neo4j or RabbitMQ).
# The waf container is the only one with public ports. Later sections add n8n and the agent on the app network.
name: northgate

x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  waf:
    <<: *defaults
    image: owasp/modsecurity-crs:4.25.2-nginx-alpine-202611190211-lts
    ports: ["${HTTP_PORT:-80}:8080", "${HTTPS_PORT:-443}:8443"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in infra/.env}
      PARANOIA: "1"
      MODSEC_RULE_ENGINE: ${MODSEC_RULE_ENGINE:-On}
      MODSEC_AUDIT_LOG_FORMAT: JSON
      MODSEC_AUDIT_LOG_PARTS: ABHKZ # headers and the matched rules, never request or response bodies
      SERVER_HEADER: ""
      ACCESSLOG: /dev/stdout
      METRICSLOG: /dev/null
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/conf.d/default.conf.template:ro,z
      - ./nginx/logging.conf.template:/etc/nginx/templates/conf.d/logging.conf.template:ro,z
      - ./nginx/static:/usr/share/nginx/static:ro,z # z: relabel for SELinux hosts (Oracle Linux); ignored elsewhere
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    networks: [edge, app]
    mem_limit: 300m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsk https://127.0.0.1:8443/health -H \"Host: $$DOMAIN\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  certbot:
    image: certbot/certbot:v5.10.0
    profiles: [tools] # run on demand: scripts/issue-certs.sh and the weekly renewal
    volumes: [letsencrypt:/etc/letsencrypt, certbot_www:/var/www/certbot]
    networks: [edge]

  presidio-analyzer:
    <<: *defaults
    image: mcr.microsoft.com/presidio-analyzer:2.2.362
    environment:
      # gunicorn 25 sometimes hangs after opening its control socket, before starting a worker (seen in CI).
      GUNICORN_CMD_ARGS: --no-control-socket
    networks: [data]
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health')\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  presidio-anonymizer:
    <<: *defaults
    image: mcr.microsoft.com/presidio-anonymizer:2.2.362
    environment:
      # gunicorn 25 sometimes hangs after opening its control socket, before starting a worker (seen in CI).
      GUNICORN_CMD_ARGS: --no-control-socket
    networks: [data]
    mem_limit: 256m
    healthcheck: # the image's own check calls localhost, which resolves to IPv6 first while the server listens on IPv4
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health')\""]
      interval: 30s
      timeout: 5s
      retries: 5

  worker:
    <<: *defaults
    build: ../services/worker
    image: northgate-worker:local
    environment:
      WORKER_DB_URL: ${WORKER_DB_URL:-}          # the northgate_worker_app login; the worker refuses to start without it
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Northgate Dental <onboarding@resend.dev>}
      EMAIL_REDIRECT_TO: ${EMAIL_REDIRECT_TO:-}  # staging and the demo: every email to one inbox
      LINK_BASE: https://n8n.${DOMAIN}/webhook          # cancel, check-in and pay links point at n8n's pages
      CLINIC_ALERT_EMAIL: ${CLINIC_ALERT_EMAIL:-}       # where urgent check-in alerts go
      PDF_URL: http://pdf:3000                     # receipts as PDF (T7); emails still go if it is down
    networks: [app, data]                          # outbound only: Supabase and Resend; data reaches the PDF renderer
    mem_limit: 128m
    profiles: [worker]                             # started once its login and key are in .env

  # T7: HTML to PDF for receipts and statements. Gotenberg wraps headless Chromium (the job the blueprint gives
  # Puppeteer) as a maintained service, so there is no browser code of our own to keep patched. Internal network only,
  # JavaScript off, and it may load nothing but the HTML it is sent.
  pdf:
    <<: *defaults
    image: gotenberg/gotenberg:9.8.0-chromium
    profiles: [worker]
    command: ["gotenberg", "--chromium-disable-javascript=true", "--chromium-allow-list=^file:///tmp/.*",
              "--api-timeout=20s", "--log-level=warn"]
    networks: [data]
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  # n8n (blueprint section 41): automations triggered by time or events. Its editor is not on the internet: only
  # /webhook/ is routed by the WAF; the editor is reached through a Bastion SSH tunnel to 127.0.0.1:5678.
  n8n-db:
    <<: *defaults
    image: postgres:17.6-alpine
    profiles: [n8n]
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD:-}
    volumes: [n8n_db:/var/lib/postgresql/data]
    networks: [data]
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      retries: 10

  n8n:
    <<: *defaults
    image: n8nio/n8n:2.43.7 # same version as the local build instance
    profiles: [n8n]
    depends_on:
      n8n-db: { condition: service_healthy }
    ports: ["127.0.0.1:5678:5678"] # editor via SSH tunnel only
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:-}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-} # encrypts stored credentials; kept off the backups
      N8N_HOST: n8n.${DOMAIN}
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://n8n.${DOMAIN}/
      N8N_PROXY_HOPS: "1"
      GENERIC_TIMEZONE: America/New_York
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"         # Code nodes cannot read server secrets (blueprint section 55)
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none        # no payloads kept from successful runs
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"               # failed runs kept 7 days for debugging
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      # Supabase signs its database certificates with its own root CA; trusting it lets n8n verify the connection
      # instead of skipping the check. Fingerprint checked against Supabase's published copy (see infra/certs).
      NODE_EXTRA_CA_CERTS: /certs/supabase-root-2021.crt
    volumes:
      - n8n_data:/home/node/.n8n
      - ./certs:/certs:ro,z
    networks: [app, data]
    mem_limit: 1g

networks:
  edge: {}
  app: {}
  data: { internal: true } # no route in or out of the VM; only services on this network can reach Presidio

volumes:
  n8n_db: {}
  n8n_data: {}
  letsencrypt: {}
  certbot_www: {}

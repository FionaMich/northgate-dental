# Applies database migrations to the staging Supabase project after a merge into develop.
# The staging environment only accepts deployments from develop, so pull requests never see its secrets.
name: deploy-staging

on:
  push:
    branches: [develop]
    paths: ['supabase/migrations/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false # never cut a migration off half way

jobs:
  migrate:
    name: migrate staging database
    runs-on: ubuntu-latest
    environment: staging
    env:
      # Session pooler connection string for northgate-staging only; no account-wide access token is used.
      STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: 3.2.0
      - run: supabase db push --db-url "$STAGING_DB_URL" # migrations only; the synthetic seed is not pushed

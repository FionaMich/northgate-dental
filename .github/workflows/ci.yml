# CI for Northgate Dental. Each later section adds its own job (database, mobile, web, agent, images, e2e, deploy).
name: ci

on:
  pull_request:
    branches: [develop, main]
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [develop, main]

permissions:
  contents: read
  pull-requests: read

jobs:
  security:
    name: security (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan the full history, not just the last commit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  guard:
    name: guard (no private files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/test-guards.sh
      - run: scripts/check-forbidden-files.sh

  docs:
    name: docs (house style)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-no-em-dash.sh

  database:
    name: database (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: 3.2.0
      - run: supabase db start # Postgres only; applies supabase/migrations and the seed
      - uses: astral-sh/setup-uv@v6
      - name: load personas and a sample of generated patients
        run: |
          cd services/synthdata && uv sync --locked
          url=postgresql://postgres:postgres@127.0.0.1:54322/postgres
          uv run synthdata check-target "$url"
          uv run synthdata generate --patients 50 --seed 2026 | psql -v ON_ERROR_STOP=1 -q "$url"
      - run: supabase test db

  synthdata:
    name: synthdata (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/synthdata
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -q

  worker:
    name: worker (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/worker
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -q # the database test skips here; it runs against the local stack and the database job's data

  agent:
    name: agent (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -q # safety gate in 12 languages and the graph with a scripted model; no Ollama in CI

  mobile:
    name: mobile (flutter test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  infra:
    name: infra (waf and presidio)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck the server scripts
        run: shellcheck -x scripts/*.sh tests/*.sh aws/*.sh
      - name: local settings (no secrets needed)
        run: sed -e 's/^DOMAIN=.*/DOMAIN=localhost/' -e 's/^HTTP_PORT=.*/HTTP_PORT=18080/' -e 's/^HTTPS_PORT=.*/HTTPS_PORT=18443/' .env.example > .env
      - name: start the front door with a placeholder certificate
        run: scripts/issue-certs.sh
      - name: attacks are refused, normal requests pass
        run: tests/test_waf.sh
      - name: Presidio removes every canary value
        run: tests/test_presidio.sh
      - name: logs on failure
        if: failure()
        run: docker compose logs --tail 100

  attribution:
    name: attribution (no AI co-authors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: commits, title and description credit no AI tool
        env: # passed through the environment, never pasted into the script, so a crafted PR body cannot run code
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          range="$BASE..HEAD"
          git cat-file -e "$BASE" 2>/dev/null || range="HEAD~1..HEAD"
          { git log "$range" --format='%B'; printf '%s\n%s\n' "$TITLE" "$BODY"; } | scripts/check-no-ai-attribution.sh

  pr-title:
    name: pr-title (Conventional Commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# CI for Northgate Dental. Each later section adds its own job (database, mobile, web, agent, images, e2e, deploy).
name: ci

on:
  pull_request:
    branches: [develop, main]
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [develop, main]

permissions:
  contents: read
  pull-requests: read

jobs:
  security:
    name: security (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan the full history, not just the last commit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  guard:
    name: guard (no private files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/test-guards.sh
      - run: scripts/check-forbidden-files.sh

  docs:
    name: docs (house style)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-no-em-dash.sh

  database:
    name: database (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: 3.2.0
      - run: supabase db start # Postgres only; applies supabase/migrations
      - run: supabase test db

  synthdata:
    name: synthdata (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/synthdata
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -q

  pr-title:
    name: pr-title (Conventional Commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

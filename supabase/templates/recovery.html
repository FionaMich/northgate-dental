<!doctype html>
<html lang="en">
<body style="margin:0;padding:0;background:#F1F6F5;font-family:'Plus Jakarta Sans',Helvetica,Arial,sans-serif;color:#0B2B2A;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:32px 16px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#FFFFFF;border-radius:24px;overflow:hidden;">
        <tr><td style="background:#0C4C46;padding:24px 28px;color:#FFFFFF;font-size:20px;font-weight:700;">Northgate <span style="color:#8FE3C8;font-weight:400;">Dental</span></td></tr>
        <tr><td style="padding:28px;">
          <h1 style="margin:0 0 12px;font-size:24px;line-height:1.2;">Reset your password</h1>
          <p style="margin:0 0 24px;font-size:15px;line-height:1.5;color:#4C6361;">Enter this code in the Northgate Dental app to choose a new password. If you did not ask for this, you can ignore this email; your password stays the same.</p>
          <p style="margin:0 0 24px;font-size:36px;font-weight:800;letter-spacing:10px;color:#137C6C;">{{ .Token }}</p>
          <p style="margin:0;font-size:13px;line-height:1.5;color:#4C6361;">The code works once and expires in 10 minutes.</p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
